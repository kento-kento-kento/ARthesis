
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>卒論ARアプリ</title>

  <!-- A-FrameとAR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ARカメラとマーカー -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true">

    <a-marker preset="hiro">
      <!-- 赤い立方体 -->
      <a-box
        position="0 0.5 0"
        color="red"
        wireframe="false" 
        scale="1 1 1">
      </a-box>

      <!-- 日本語のAR案内 -->
      <a-text
        id="ar-instruction"
        value="この部品を
        取り付けて"
        position="0 1.1 0"
        rotation="-90 0 0"
        align="center"
        color="#FFFF00"
        width="6"
        scale="0.7 0.7 0.7"
        font="https://cdn.jsdelivr.net/gh/studioTeaTwo/aframe-japanese-font@main/fonts/noto-sans-cjk-jp/noto-sans-cjk-jp-msdf.json"
        font-image="https://cdn.jsdelivr.net/gh/studioTeaTwo/aframe-japanese-font@main/fonts/noto-sans-cjk-jp/noto-sans-cjk-jp-msdf.png"
        shader="msdf"
        negate="false"
        side="double">
      </a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- コンパクトな上部タイトル -->
  <header class="top-panel">
    <h1>AR組立作業サポート</h1>
  </header>

  <!-- 提示情報量の設定パネル -->
  <section
    id="settings-panel"
    class="bottom-panel"
    aria-label="提示情報量の設定"
    aria-hidden="true">

    <p class="panel-title">提示情報量</p>

    <select
      id="level-select"
      class="level-select"
      aria-label="提示情報量を選択">

      <option value="low">少ない：部品・取り付け位置</option>
      <option value="medium" selected>標準：手順・部品の向き</option>
      <option value="high">詳しい：注意点も表示</option>
    </select>
    <div class="step-controls">
        <button id="prev-step-button" type="button">前の手順に進む</button>
        <span id="step-counter">手順 1 / 2</span>
        <button id="next-step-button" type="button">次の手順に進む</button>
    </div>
  </section>

  <!-- 設定パネルを開閉するボタン -->
  <button
    id="settings-button"
    class="settings-button"
    type="button"
    aria-label="設定を開く"
    aria-expanded="false"
    aria-controls="settings-panel">
    ⚙
  </button>

  <!-- JavaScript -->
   <script src="instructions.js"></script>
  <script src="script.js"></script>
</body>
</html>
