
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実験ログ管理画面</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <main class="admin-container">
    <h1>実験ログ管理画面</h1>

    <section>
        <h2>保存済み実験ログ</h2>

        <!-- CSV出力 -->
        <div class="csv-export-section">
            <h3>実験データの出力</h3>

            <button id="export-logs-button" type="button">
                実験ログCSVを出力
            </button>

            <button id="export-events-button" type="button">
                操作履歴CSVを出力
            </button>

            <button id="export-errors-button" type="button">
                作業ミスCSVを出力
            </button>
        </div>

        <div id="log-list">
            <p>実験ログを読み込んでいます。</p>
        </div>
    </section>

        <section id="log-detail-section">
        <h2>実験ログの詳細</h2>

        <button id="close-detail-button" type="button">
            詳細を閉じる
        </button>

        <div id="log-detail">
            <p>確認したい実験ログを選択してください。</p>
        </div>

        <!-- 作業ミスの登録 -->
        <div id="error-entry-section" hidden>
            <h3>作業ミスの登録</h3>

            <label for="error-type">ミスの種類</label>
            <select id="error-type">
                <option value="wrong_position">指定位置と異なる場所への取り付け</option>
                <option value="wrong_orientation">指定方向と異なる向きでの取り付け</option>
                <option value="wrong_part">指定部品と異なる部品の使用</option>
                <option value="missing_part">必要な部品の取り付け忘れ</option>
                <option value="order_deviation">工程順序の逸脱</option>
            </select>

            <label for="error-step">発生した手順</label>
            <input id="error-step" type="number" min="1" placeholder="例：3">

            <label for="error-video-time">動画内の時刻</label>
            <input id="error-video-time" type="text" placeholder="例：00:02:35">

            <label for="error-description">詳細</label>
            <textarea id="error-description" placeholder="ミスの内容"></textarea>

            <label>
                <input type="checkbox" id="error-corrected">
                被験者が自分で修正した
            </label>

            <button id="save-error-button" type="button">
                作業ミスを登録
            </button>
        </div>
    </section>
  </main>

  <script src="admin.js"></script>

</body>
</html>
